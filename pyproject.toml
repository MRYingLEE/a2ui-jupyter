[project]
name = "a2ui-jupyter-workspace"
version = "0.1.0"
description = "A2UI Jupyter Python workspace root"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "python/a2ui_form",
  "python/a2ui_jupyter",
]

[dependency-groups]
dev = [
  "jupyter-client>=8.6.0",
  "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = [
  "python/a2ui_form/tests",
  "python/a2ui_jupyter/tests",
]
norecursedirs = [
  ".*",
  "node_modules",
  "typescript",
  ".venv",
]
